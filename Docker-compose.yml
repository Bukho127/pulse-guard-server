version: "3.8"

services:
  # Valkey (Redis-compatible)
  valkey:
    image: valkey/valkey:latest
    container_name: pulse-guard-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pulse-guard-network

  # Express Backend
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulse-guard-backend
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      PORT: 5001
      NODE_ENV: production

      # Queue
      NOTIFICATION_QUEUE_DRIVER: bull
      REDIS_HOST: valkey
      REDIS_PORT: 6379

      # Go Worker
      GO_SERVICE_URL: http://go-worker:5002
    depends_on:
      valkey:
        condition: service_healthy
      go-worker:
        condition: service_started
    restart: unless-stopped
    networks:
      - pulse-guard-network

  # Golang Worker
  go-worker:
    build:
      context: ./go-worker
      dockerfile: Dockerfile
    container_name: pulse-guard-media-worker
    ports:
      - "5002:5002"
    env_file:
      - ../Pulse-guard-worker-golang/.env
    restart: unless-stopped
    networks:
      - pulse-guard-network

volumes:
  valkey-data:

networks:
  pulse-guard-network:
    driver: bridge