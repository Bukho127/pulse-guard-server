apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-guard-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulse-guard-backend
  template:
    metadata:
      labels:
        app: pulse-guard-backend
    spec:
      containers:
      - name: pulse-guard-backend
        image: pulseguardacr220235236.azurecr.io/pulse-guard-backend:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 5001

        readinessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3

        envFrom:
        - secretRef:
            name: pulse-guard-secret

        env:
        - name: REDIS_HOST
          value: "valkey"
        - name: REDIS_PORT
          value: "6379"
        - name: GO_SERVICE_URL
          value: "http://go-worker:5002"

        volumeMounts:
        - name: uploads
          mountPath: /app/uploads

      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: uploads-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: pulse-guard-backend
spec:
  selector:
    app: pulse-guard-backend
  ports:
  - port: 5001
    targetPort: 5001
  type: LoadBalancer
