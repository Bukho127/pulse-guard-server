apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulse-guard-backend-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pulseguard-api.southafricanorth.cloudapp.azure.com
      secretName: pulse-guard-backend-tls
  rules:
    - host: pulseguard-api.southafricanorth.cloudapp.azure.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulse-guard-backend
                port:
                  number: 5001