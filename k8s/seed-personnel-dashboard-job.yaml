apiVersion: batch/v1
kind: Job
metadata:
  name: seed-personnel-dashboard
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: seed-personnel-dashboard
    spec:
      restartPolicy: OnFailure
      containers:
      - name: seed-personnel-dashboard
        image: pulseguardacr220235236.azurecr.io/pulse-guard-backend:latest
        imagePullPolicy: Always
        command: ["npm", "run", "seed:personnel-dashboard"]
        envFrom:
        - secretRef:
            name: pulse-guard-secret
